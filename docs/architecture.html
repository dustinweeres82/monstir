<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monstir — App Architecture Map</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e14;
    --surface: #16161f;
    --border: #2a2a3a;
    --text: #e8e8f0;
    --muted: #7a7a9a;
    --purple: #8b5cf6;
    --green: #22c55e;
    --blue: #3b82f6;
    --orange: #f97316;
    --grey: #6b7280;
    --red: #ef4444;
    --yellow: #eab308;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* ── TOP BAR ── */
  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    z-index: 1000;
  }
  #topbar h1 {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
    white-space: nowrap;
  }
  #topbar .tagline {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  #search {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 7px 12px;
    font-size: 13px;
    width: 200px;
    outline: none;
    transition: border-color 0.2s;
  }
  #search:focus { border-color: var(--purple); }
  #search::placeholder { color: var(--muted); }

  .btn-reset {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-reset:hover { border-color: var(--purple); color: var(--text); }

  /* ── CANVAS ── */
  #canvas-wrap {
    position: fixed;
    top: 56px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    cursor: grab;
  }
  #canvas-wrap.panning { cursor: grabbing; }
  #canvas {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
  }

  /* SVG arrows */
  #arrows-svg {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    overflow: visible;
  }

  /* ── NODES ── */
  .node {
    position: absolute;
    border-radius: 14px;
    border: 1.5px solid transparent;
    padding: 12px 14px 10px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.25s;
    min-width: 160px;
    max-width: 200px;
  }
  .node:hover { transform: scale(1.04); }
  .node.dragging { cursor: grabbing; transform: scale(1.05); z-index: 100; }
  .node.dimmed { opacity: 0.22; }
  .node.highlighted { box-shadow: 0 0 0 3px white; }

  .node-header {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 5px;
  }
  .node-title {
    font-size: 12px;
    font-weight: 700;
    line-height: 1.3;
    flex: 1;
  }
  .node-desc {
    font-size: 10.5px;
    color: rgba(255,255,255,0.65);
    line-height: 1.45;
  }
  .status-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.working  { background: #22c55e; }
  .status-dot.issues   { background: #ef4444; }
  .status-dot.partial  { background: #eab308; }

  /* colour categories */
  .node.purple { background: #1e1232; border-color: #6d28d9; }
  .node.purple .node-title { color: #c4b5fd; }
  .node.green  { background: #0f2318; border-color: #166534; }
  .node.green  .node-title { color: #86efac; }
  .node.blue   { background: #0e1e38; border-color: #1d4ed8; }
  .node.blue   .node-title { color: #93c5fd; }
  .node.orange { background: #2b1500; border-color: #c2410c; }
  .node.orange .node-title { color: #fdba74; }
  .node.grey   { background: #181820; border-color: #374151; }
  .node.grey   .node-title { color: #d1d5db; }

  /* ── SIDE PANEL ── */
  #panel {
    position: fixed;
    top: 56px; right: 0;
    width: 340px;
    height: calc(100vh - 56px);
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.25s cubic-bezier(.4,0,.2,1);
    z-index: 900;
    padding: 20px;
  }
  #panel.open { transform: translateX(0); }

  #panel .panel-close {
    position: absolute;
    top: 14px; right: 14px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--border);
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #panel .panel-close:hover { background: var(--purple); color: white; }

  .panel-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 12px;
    border: 1px solid transparent;
  }

  .panel-title { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 6px; }
  .panel-desc  { font-size: 13px; color: var(--muted); line-height: 1.55; margin-bottom: 18px; }

  .panel-section {
    margin-bottom: 16px;
  }
  .panel-section h4 {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .panel-section ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .panel-section li {
    font-size: 12.5px;
    color: var(--text);
    padding: 5px 10px;
    background: var(--bg);
    border-radius: 7px;
    border: 1px solid var(--border);
    line-height: 1.4;
  }
  .panel-section li.issue {
    background: #1e0808;
    border-color: #7f1d1d;
    color: #fca5a5;
  }
  .panel-section li.issue::before { content: '⚠ '; }

  .conn-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 9px;
    cursor: pointer;
    margin: 3px;
    transition: border-color 0.15s;
  }
  .conn-chip:hover { border-color: var(--purple); color: var(--purple); }
  .conn-chip .dot { width: 7px; height: 7px; border-radius: 50%; }

  /* ── LEGEND ── */
  #legend {
    position: fixed;
    bottom: 20px; left: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 11.5px;
    z-index: 500;
  }
  #legend h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 8px; }
  .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

  /* ── ZOOM CONTROLS ── */
  #zoom-controls {
    position: fixed;
    bottom: 20px; right: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 500;
  }
  .zoom-btn {
    width: 36px; height: 36px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .zoom-btn:hover { border-color: var(--purple); }

  /* Edge labels */
  .edge-label {
    font-size: 10px;
    fill: #7a7a9a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
</style>
</head>

// ─── ENGINE ───────────────────────────────────────────────────────────────────

const canvas = document.getElementById('canvas');
const svg    = document.getElementById('arrows-svg');
const panel  = document.getElementById('panel');
const wrap   = document.getElementById('canvas-wrap');

let zoom = 0.72, panX = 40, panY = 40;
let isPanning = false, panStartX = 0, panStartY = 0;
let activeNode = null;

// Node DOM map
const nodeEls = {};

// Build nodes
NODES.forEach(n => {
  const el = document.createElement('div');
  el.className = `node ${n.category}`;
  el.id = 'node-' + n.id;
  el.style.left = n.x + 'px';
  el.style.top  = n.y + 'px';

  const statusClass = n.status === 'working' ? 'working' : n.status === 'issues' ? 'issues' : 'partial';

  el.innerHTML = `
    <div class="node-header">
      <div class="status-dot ${statusClass}"></div>
      <div class="node-title">${n.label}</div>
    </div>
    <div class="node-desc">${n.desc.slice(0, 80)}${n.desc.length > 80 ? '…' : ''}</div>
  `;

  el.addEventListener('click', (e) => { e.stopPropagation(); openPanel(n); });
  makeDraggable(el, n);
  canvas.appendChild(el);
  nodeEls[n.id] = el;
});

// ── DRAGGING ──
function makeDraggable(el, nodeData) {
  let dragging = false, ox = 0, oy = 0, sx = 0, sy = 0;

  el.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    dragging = true;
    el.classList.add('dragging');
    ox = nodeData.x; oy = nodeData.y;
    sx = e.clientX;  sy = e.clientY;
    e.stopPropagation();
    e.preventDefault();
  });

  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = (e.clientX - sx) / zoom;
    const dy = (e.clientY - sy) / zoom;
    nodeData.x = ox + dx;
    nodeData.y = oy + dy;
    el.style.left = nodeData.x + 'px';
    el.style.top  = nodeData.y + 'px';
    drawArrows();
  });

  window.addEventListener('mouseup', () => {
    if (dragging) { dragging = false; el.classList.remove('dragging'); }
  });
}

// ── ARROWS ──
function getNodeCenter(id) {
  const n = NODES.find(x => x.id === id);
  const el = nodeEls[id];
  if (!n || !el) return { x: 0, y: 0 };
  const w = el.offsetWidth  || 180;
  const h = el.offsetHeight || 80;
  return { x: n.x + w / 2, y: n.y + h / 2 };
}

function getCategoryColor(id) {
  const n = NODES.find(x => x.id === id);
  if (!n) return '#555';
  return { purple:'#7c3aed', green:'#16a34a', blue:'#2563eb', orange:'#ea580c', grey:'#4b5563' }[n.category] || '#555';
}

function drawArrows() {
  const W = 6000, H = 4000;
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);

  let defs = '<defs>';
  EDGES.forEach((e, i) => {
    const col = getCategoryColor(e.from);
    defs += `<marker id="ah${i}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="${col}" opacity="0.7"/></marker>`;
  });
  defs += '</defs>';

  let paths = '';
  EDGES.forEach((e, i) => {
    const f = getNodeCenter(e.from);
    const t = getNodeCenter(e.to);
    const col = getCategoryColor(e.from);
    const mx = (f.x + t.x) / 2;
    const my = (f.y + t.y) / 2;
    const dx = t.x - f.x, dy = t.y - f.y;
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    const cx1 = f.x + dx * 0.4 + (-dy/len) * 40;
    const cy1 = f.y + dy * 0.4 + (dx/len) * 40;

    paths += `<path d="M${f.x},${f.y} Q${cx1},${cy1} ${t.x},${t.y}" stroke="${col}" stroke-opacity="0.45" stroke-width="1.5" fill="none" marker-end="url(#ah${i})"/>`;

    if (e.label) {
      const lx = (f.x + cx1 + t.x) / 3;
      const ly = (f.y + cy1 + t.y) / 3;
      paths += `<text x="${lx}" y="${ly}" class="edge-label" text-anchor="middle">${e.label.slice(0,30)}</text>`;
    }
  });

  svg.innerHTML = defs + paths;
}

// ── PANEL ──
function openPanel(n) {
  activeNode = n.id;
  highlightConnected(n.id);

  const categoryColors = { purple:'#8b5cf6', green:'#22c55e', blue:'#3b82f6', orange:'#f97316', grey:'#9ca3af' };
  const categoryLabels = { purple:'Parent Screen', green:'Kid Screen', blue:'Onboarding', orange:'Battle / Game', grey:'Shared' };
  const col = categoryColors[n.category] || '#888';
  const catLabel = categoryLabels[n.category] || '';

  const statusLabel = n.status === 'working' ? '🟢 Working' : n.status === 'issues' ? '🔴 Has Known Issues' : '🟡 Partial / In Progress';
  const statusBg = n.status === 'working' ? '#052e16' : n.status === 'issues' ? '#1f1015' : '#1c1800';
  const statusBorder = n.status === 'working' ? '#16a34a' : n.status === 'issues' ? '#dc2626' : '#ca8a04';

  let connectedHtml = '';
  const connectedIds = [];
  EDGES.forEach(e => {
    if (e.from === n.id) connectedIds.push({ id: e.to, dir: '→', label: e.label });
    if (e.to === n.id)   connectedIds.push({ id: e.from, dir: '←', label: e.label });
  });
  if (connectedIds.length > 0) {
    connectedHtml = `<div class="panel-section"><h4>Connected Screens</h4><div style="display:flex;flex-wrap:wrap">`;
    connectedIds.forEach(c => {
      const cn = NODES.find(x => x.id === c.id);
      if (!cn) return;
      const cc = categoryColors[cn.category] || '#888';
      connectedHtml += `<span class="conn-chip" onclick="jumpTo('${c.id}')"><span class="dot" style="background:${cc}"></span>${cn.label}</span>`;
    });
    connectedHtml += `</div></div>`;
  }

  const readsHtml = n.reads.length ? `<div class="panel-section"><h4>What This Screen Reads</h4><ul>${n.reads.map(r => `<li>${r}</li>`).join('')}</ul></div>` : '';
  const writesHtml = n.writes.length ? `<div class="panel-section"><h4>What This Screen Writes / Changes</h4><ul>${n.writes.map(r => `<li>${r}</li>`).join('')}</ul></div>` : '';
  const issuesHtml = n.issues.length ? `<div class="panel-section"><h4>Known Issues</h4><ul>${n.issues.map(r => `<li class="issue">${r}</li>`).join('')}</ul></div>` : '';

  document.getElementById('panel-content').innerHTML = `
    <div class="panel-badge" style="background:${col}22;border-color:${col}44;color:${col}">${catLabel}</div>
    <div class="panel-title">${n.label}</div>
    <div class="panel-desc">${n.desc}</div>
    <div class="panel-badge" style="background:${statusBg};border-color:${statusBorder};color:${statusBorder === '#dc2626' ? '#fca5a5' : statusBorder === '#ca8a04' ? '#fde047' : '#86efac'};margin-bottom:20px">${statusLabel}</div>
    ${readsHtml}
    ${writesHtml}
    ${issuesHtml}
    ${connectedHtml}
  `;
  panel.classList.add('open');
}

function jumpTo(id) {
  const n = NODES.find(x => x.id === id);
  if (!n) return;
  openPanel(n);
  // Pan to node
  const el = nodeEls[id];
  const w = el ? el.offsetWidth  : 180;
  const h = el ? el.offsetHeight : 80;
  const cx = window.innerWidth / 2;
  const cy = (window.innerHeight - 56) / 2 + 56;
  panX = cx - (n.x + w/2) * zoom;
  panY = cy - (n.y + h/2) * zoom;
  applyTransform();
}

function highlightConnected(id) {
  const connected = new Set([id]);
  EDGES.forEach(e => { if (e.from === id) connected.add(e.to); if (e.to === id) connected.add(e.from); });
  NODES.forEach(n => {
    const el = nodeEls[n.id];
    if (!el) return;
    if (connected.has(n.id)) {
      el.classList.remove('dimmed');
      el.classList.toggle('highlighted', n.id === id);
    } else {
      el.classList.add('dimmed');
      el.classList.remove('highlighted');
    }
  });
}

function clearHighlight() {
  NODES.forEach(n => {
    const el = nodeEls[n.id];
    if (!el) return;
    el.classList.remove('dimmed', 'highlighted');
  });
}

document.getElementById('panel-close').addEventListener('click', () => {
  panel.classList.remove('open');
  activeNode = null;
  clearHighlight();
});

canvas.addEventListener('click', () => {
  if (activeNode) { panel.classList.remove('open'); activeNode = null; clearHighlight(); }
});

// ── PAN ──
wrap.addEventListener('mousedown', e => {
  if (e.target === wrap || e.target === canvas || e.target === svg) {
    isPanning = true;
    panStartX = e.clientX - panX;
    panStartY = e.clientY - panY;
    wrap.classList.add('panning');
  }
});

window.addEventListener('mousemove', e => {
  if (!isPanning) return;
  panX = e.clientX - panStartX;
  panY = e.clientY - panStartY;
  applyTransform();
});

window.addEventListener('mouseup', () => {
  isPanning = false;
  wrap.classList.remove('panning');
});

// ── ZOOM ──
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newZoom = Math.min(2, Math.max(0.2, zoom * delta));
  const rx = e.clientX;
  const ry = e.clientY - 56;
  panX = rx - (rx - panX) * (newZoom / zoom);
  panY = ry - (ry - panY) * (newZoom / zoom);
  zoom = newZoom;
  applyTransform();
}, { passive: false });

document.getElementById('btn-zoom-in').addEventListener('click', () => {
  zoom = Math.min(2, zoom * 1.2);
  applyTransform();
});
document.getElementById('btn-zoom-out').addEventListener('click', () => {
  zoom = Math.max(0.2, zoom / 1.2);
  applyTransform();
});

document.getElementById('btn-reset').addEventListener('click', () => {
  zoom = 0.72; panX = 40; panY = 40;
  applyTransform();
});

function applyTransform() {
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  drawArrows();
}

// ── SEARCH ──
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { clearHighlight(); return; }
  const matched = new Set();
  NODES.forEach(n => {
    if (n.label.toLowerCase().includes(q) || n.desc.toLowerCase().includes(q)) matched.add(n.id);
  });
  NODES.forEach(n => {
    const el = nodeEls[n.id];
    if (!el) return;
    if (matched.has(n.id)) { el.classList.remove('dimmed'); el.classList.add('highlighted'); }
    else { el.classList.add('dimmed'); el.classList.remove('highlighted'); }
  });
});

// ── CANVAS SIZE ──
function resizeCanvas() {
  const maxX = Math.max(...NODES.map(n => n.x + 250)) + 200;
  const maxY = Math.max(...NODES.map(n => n.y + 200)) + 200;
  canvas.style.width  = maxX + 'px';
  canvas.style.height = maxY + 'px';
}

// ── INIT ──
resizeCanvas();
applyTransform();

// Re-draw on font load (sizes may shift)
setTimeout(() => { drawArrows(); }, 400);
